apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-notification
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.notification.replicas }}
  selector:
    matchLabels:
      app: app-notification
  template:
    metadata:
      labels:
        app: app-notification
    spec:
      containers:
      - name: app-notification
        image: "{{ .Values.notification.image }}:{{ .Values.notification.tag }}"
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: postgres-secret
