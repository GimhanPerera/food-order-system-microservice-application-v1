apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-backend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.adminBackend.replicas }}
  selector:
    matchLabels:
      app: admin-backend
  template:
    metadata:
      labels:
        app: admin-backend
    spec:
      containers:
      - name: admin-backend
        image: "{{ .Values.adminBackend.image }}:{{ .Values.adminBackend.tag }}"
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: postgres-secret
